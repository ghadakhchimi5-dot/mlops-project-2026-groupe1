[tool.poetry]
name = "carereturn"
version = "0.1.0"
description = "CareReturn — MLOps platform for 30-day readmission risk of diabetic patients"
authors = ["Ghada KHCHIMI", "Wissem ZAOUGA", "Akrem ELOUER"]
readme = "README.md"
packages = [{ include = "carereturn", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = "^2.2"
numpy = ">=1.26,<3"
pyarrow = ">=15"
scikit-learn = "^1.5"
mlflow = "^2.16"
sqlalchemy = ">=2.0,<2.1"  # mlflow 2.x imports FallbackAsyncAdaptedQueuePool, removed in 2.1
matplotlib = "^3.8"
pyyaml = "^6.0"
joblib = "^1.4"
requests = "^2.32"
fastapi = ">=0.115"
uvicorn = { extras = ["standard"], version = ">=0.30" }
pydantic = "^2.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
httpx = ">=0.27"
ruff = ">=0.6"
mypy = "^1.10"
pre-commit = "^3.7"
types-pyyaml = "*"
types-requests = "*"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=carereturn --cov-report=term-missing"
markers = [
    "integration: tests that need real data or trained artifacts",
]

[tool.coverage.run]
source = ["carereturn"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
