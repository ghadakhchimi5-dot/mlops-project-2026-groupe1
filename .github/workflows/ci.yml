name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "poetry"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff check)
        run: poetry run ruff check .

      - name: Lint (ruff format)
        run: poetry run ruff format --check .

      - name: Run unit tests (coverage)
        run: poetry run pytest -m "not integration" --cov=carereturn --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (build only, no push)
        run: docker build -t carereturn-api:${{ github.sha }} .

      # TODO: add the CML report job here — post data metrics, drift/plots
      # (e.g. training curves, confusion matrix) to the PR as a comment.
